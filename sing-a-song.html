<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sing a Song - Tesco Activity</title>
    <!-- Confetti Canvas Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #3d2300 0%, #170d00 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
            padding: 20px 20px 110px 20px;
            overflow: hidden;
            position: relative;
        }

        .card {
            background: #211608;
            border: 2px solid #e89923;
            border-radius: 24px;
            padding: 36px 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(232, 153, 35, 0.25);
            position: relative;
            z-index: 10;
        }

        .brand-badge {
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffb703;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .mic-icon {
            font-size: 3.5rem;
            margin-bottom: 8px;
            animation: pulseGlow 1.2s infinite alternate ease-in-out;
            display: inline-block;
        }

        @keyframes pulseGlow {
            0% {
                transform: scale(0.95);
                filter: drop-shadow(0 0 5px rgba(255, 183, 3, 0.4));
            }

            100% {
                transform: scale(1.08);
                filter: drop-shadow(0 0 15px rgba(255, 183, 3, 0.9));
            }
        }

        h1 {
            font-size: 2.1rem;
            font-weight: 900;
            color: #ffb703;
            margin-bottom: 8px;
        }

        p {
            font-size: 1.05rem;
            color: #ffeedb;
            margin-bottom: 24px;
            line-height: 1.45;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }

        .complete-btn {
            width: 100%;
            padding: 13px 26px;
            background: linear-gradient(135deg, #ffb703 0%, #e89923 100%);
            border: none;
            border-radius: 12px;
            color: #1a1002;
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(232, 153, 35, 0.4);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .complete-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #ffd166 0%, #ffb703 100%);
            box-shadow: 0 10px 25px rgba(232, 153, 35, 0.55);
        }

        .back-link {
            font-size: 0.85rem;
            color: #e89923;
            text-decoration: none;
            font-weight: 700;
            margin-top: 6px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #ffd166;
            text-decoration: underline;
        }

        .redirect-notice {
            display: none;
            font-size: 0.92rem;
            color: #ffb703;
            margin-top: 10px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* -------------------------------------------------------------
           BOTTOM SCREEN ANIMATED HUMAN SINGERS / BAND
        ------------------------------------------------------------- */
        .bottom-cartoon-stage {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 96px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 48px;
            background: linear-gradient(to top, rgba(18, 9, 0, 0.96) 0%, rgba(18, 9, 0, 0) 100%);
            pointer-events: none;
            z-index: 5;
            padding-bottom: 8px;
        }

        .cartoon-member {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .cartoon-char {
            font-size: 3.4rem;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.85));
            user-select: none;
        }

        /* Rhythmic Singing Animations */
        .singer-lead {
            animation: bounceLead 0.7s infinite alternate ease-in-out;
        }

        .singer-guitar {
            animation: bounceGuitar 0.85s infinite alternate ease-in-out;
            animation-delay: 0.15s;
        }

        .singer-backing {
            animation: bounceBacking 0.65s infinite alternate ease-in-out;
            animation-delay: 0.3s;
        }

        @keyframes bounceLead {
            0% {
                transform: translateY(0) rotate(-5deg) scale(0.96);
            }

            100% {
                transform: translateY(-18px) rotate(5deg) scale(1.08);
            }
        }

        @keyframes bounceGuitar {
            0% {
                transform: translateY(0) rotate(6deg) scale(0.98);
            }

            100% {
                transform: translateY(-20px) rotate(-6deg) scale(1.1);
            }
        }

        @keyframes bounceBacking {
            0% {
                transform: translateY(0) rotate(-4deg) scale(0.95);
            }

            100% {
                transform: translateY(-15px) rotate(6deg) scale(1.06);
            }
        }

        /* Floating Musical Notes */
        .stage-note {
            position: absolute;
            top: -12px;
            font-size: 1.3rem;
            color: #ffd166;
            animation: noteFloat 1.8s infinite linear;
            opacity: 0;
        }

        .note-a {
            left: -8px;
            animation-delay: 0.2s;
        }

        .note-b {
            right: -6px;
            animation-delay: 0.8s;
        }

        .note-c {
            left: 4px;
            animation-delay: 1.3s;
        }

        @keyframes noteFloat {
            0% {
                transform: translateY(0) scale(0.8);
                opacity: 0;
            }

            30% {
                opacity: 1;
            }

            80% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-42px) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="brand-badge">FUN TEAM CHALLENGE</div>
        <div class="mic-icon">🎤</div>

        <h1>Sing a Song!</h1>
        <p>You or your team must sing <strong>4 lines</strong> of any popular song or jingle! Everyone else can join in
            and sing along!</p>

        <div class="btn-group">
            <button class="complete-btn" id="finishBtn" onclick="finishSinging()">
                🎉 Done Singing &amp; Finish
            </button>

            <div class="redirect-notice" id="redirectNotice">
                Directing to wrap-up video in <span id="countdownSec"
                    style="font-weight: 900; color: #fff;">3</span>s...
            </div>

            <a href="index.html" class="back-link">← Return to Spin Wheel</a>
        </div>
    </div>

    <!-- Animated Human Band / Choir along bottom -->
    <div class="bottom-cartoon-stage">
        <div class="cartoon-member">
            <span class="stage-note note-a">🎵</span>
            <div class="cartoon-char singer-lead" title="Lead Singer">👨‍🎤</div>
        </div>

        <div class="cartoon-member">
            <span class="stage-note note-b">🎶</span>
            <div class="cartoon-char singer-guitar" title="Guitarist">👩‍🎤</div>
        </div>

        <div class="cartoon-member">
            <span class="stage-note note-c">✨</span>
            <div class="cartoon-char singer-backing" title="Vocalist & Performer">🧑‍🎤</div>
        </div>
    </div>

    <script>
        let finished = false;

        function finishSinging() {
            if (finished) return;
            finished = true;

            // Musical confetti explosion
            confetti({
                particleCount: 110,
                spread: 85,
                origin: { y: 0.6 },
                colors: ['#ffb703', '#ffd166', '#fb8500', '#ffffff', '#219ebc']
            });

            const btn = document.getElementById("finishBtn");
            btn.style.opacity = "0.75";
            btn.style.cursor = "default";
            btn.innerText = "🌟 Bravo! Performance Complete!";

            const notice = document.getElementById("redirectNotice");
            notice.style.display = "block";

            let seconds = 3;
            const counter = document.getElementById("countdownSec");

            const interval = setInterval(() => {
                seconds--;
                if (counter) counter.innerText = seconds;
                if (seconds <= 0) {
                    clearInterval(interval);
                }
            }, 1000);

            // Auto-redirect to thank-you.html
            setTimeout(() => {
                window.location.href = "thank-you.html";
            }, 3000);
        }
    </script>
</body>

</html>
