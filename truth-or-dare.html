<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Truth or Dare - Tesco Activity</title>
    <!-- Confetti Canvas Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #2e1014 0%, #0d0405 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-align: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        .ambient-glow {
            position: absolute;
            width: 480px;
            height: 480px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(230, 57, 70, 0.22) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(50px);
            z-index: 1;
            pointer-events: none;
            transition: all 0.4s ease;
        }

        .card {
            background: #1c1417;
            border: 2px solid #e63946;
            border-radius: 26px;
            padding: 38px 30px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.85), 0 0 24px rgba(230, 57, 70, 0.25);
            max-width: 540px;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        .brand-badge {
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #ffb703;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        h1 {
            font-size: 2.3rem;
            color: #ff4d6d;
            margin-bottom: 6px;
            font-weight: 900;
            letter-spacing: 0.5px;
        }

        .subtitle {
            color: #f1a5b4;
            font-size: 0.95rem;
            margin-bottom: 22px;
        }

        .tag-pill {
            display: inline-block;
            font-size: 0.82rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 5px 16px;
            border-radius: 14px;
            margin-bottom: 14px;
            background: rgba(255, 255, 255, 0.08);
            color: #ffd166;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* -------------------------------------------------------------
           DYNAMIC VISUAL PROMPT BOX
        ------------------------------------------------------------- */
        .prompt-box {
            background: #2b1b20;
            border: 2px dashed rgba(255, 209, 102, 0.4);
            border-radius: 20px;
            padding: 26px 22px;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 22px;
            line-height: 1.45;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .prompt-icon {
            font-size: 2.2rem;
            margin-bottom: 8px;
            display: inline-block;
            transition: transform 0.3s;
        }

        /* Visual Style when TRUTH is active */
        .prompt-box.is-truth {
            background: radial-gradient(circle at center, #11284a 0%, #0d1a2d 100%);
            border: 2px solid #3a86ff;
            box-shadow: 0 0 25px rgba(58, 134, 255, 0.35), inset 0 0 15px rgba(58, 134, 255, 0.15);
        }

        /* Visual Style when DARE is active */
        .prompt-box.is-dare {
            background: radial-gradient(circle at center, #380d14 0%, #20080c 100%);
            border: 2px solid #ff4d6d;
            box-shadow: 0 0 25px rgba(255, 77, 109, 0.4), inset 0 0 15px rgba(255, 77, 109, 0.2);
        }

        .prompt-box.shake {
            animation: popIn 0.35s ease;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.92);
                opacity: 0.6;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .btn-group {
            display: flex;
            gap: 14px;
            justify-content: center;
            margin-bottom: 16px;
        }

        button {
            padding: 13px 28px;
            font-size: 1.05rem;
            font-weight: 800;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: #fff;
            transition: transform 0.15s, box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(1px);
        }

        .truth-btn {
            background: linear-gradient(135deg, #1d4ed8, #3a86ff);
            box-shadow: 0 4px 15px rgba(58, 134, 255, 0.4);
        }

        .truth-btn:hover {
            background: linear-gradient(135deg, #2563eb, #60a5fa);
            box-shadow: 0 6px 20px rgba(58, 134, 255, 0.6);
        }

        .dare-btn {
            background: linear-gradient(135deg, #b91c1c, #d90429);
            box-shadow: 0 4px 15px rgba(217, 4, 41, 0.4);
        }

        .dare-btn:hover {
            background: linear-gradient(135deg, #dc2626, #ef233c);
            box-shadow: 0 6px 20px rgba(217, 4, 41, 0.6);
        }

        /* Finish Button (Revealed after a challenge is picked) */
        .finish-btn {
            display: none;
            width: 100%;
            background: linear-gradient(135deg, #ffd166 0%, #ffb703 100%);
            color: #1a1002;
            padding: 13px 20px;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 800;
            margin-bottom: 12px;
            box-shadow: 0 4px 18px rgba(255, 183, 3, 0.45);
            animation: fadeIn 0.3s ease-out;
        }

        .finish-btn:hover {
            background: linear-gradient(135deg, #ffe082 0%, #ffd166 100%);
            box-shadow: 0 6px 22px rgba(255, 183, 3, 0.6);
        }

        .redirect-notice {
            display: none;
            font-size: 0.92rem;
            color: #ffd166;
            margin-bottom: 14px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .back-btn {
            display: inline-block;
            text-decoration: none;
            color: #cbd5e1;
            font-size: 0.88rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 8px;
            transition: background 0.2s, color 0.2s;
        }

        .back-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body>

    <div class="ambient-glow" id="glowLight"></div>

    <div class="card">
        <div class="brand-badge">TEAM BONDING ROUND</div>
        <h1>🎭 Truth or Dare</h1>
        <p class="subtitle">Pick your challenge for the round!</p>

        <span class="tag-pill" id="typeBadge">Awaiting Choice</span>

        <div class="prompt-box" id="displayBox">
            <span class="prompt-icon" id="promptIcon">🎲</span>
            <div id="promptText">Will you choose a Truth or face a Dare?</div>
        </div>

        <div class="btn-group">
            <button class="truth-btn" onclick="getTruth()">🤔 Truth</button>
            <button class="dare-btn" onclick="getDare()">🔥 Dare</button>
        </div>

        <!-- Completion trigger -->
        <button class="finish-btn" id="finishBtn" onclick="finishTurn()">
            🎉 Challenge Completed &amp; Finish
        </button>

        <div class="redirect-notice" id="redirectNotice">
            Directing to wrap-up video in <span id="countdownSec" style="font-weight: 900; color: #fff;">3</span>s...
        </div>

        <div>
            <a href="index.html" class="back-btn">← Back to Wheel</a>
        </div>
    </div>

    <script>
        const truths = [
            "What is the funniest mistake or misunderstanding you had during your first month at Tesco?",
            "If you could switch roles with anyone in your department for a day, who would it be?",
            "What is your ultimate go-to Tesco meal deal combination (main, snack, drink)?",
            "What is one work tool (Excel, Teams, etc.) that you secretly struggle with or love the most?",
            "What is the most unusual product you have ever seen on a Tesco shelf?",
            "If you had to pitch one dream product to put on Tesco shelves tomorrow, what would it be?"
        ];

        const dares = [
            "Deliver a 30-second retail radio announcer commercial for Tesco Organic Oats!",
            "Do your best impression of a busy store manager during peak holiday shopping hours.",
            "Hum or sing the chorus of any song until someone on the team correctly guesses it!",
            "Speak in rhyme for the next 2 minutes of the game!",
            "Do 10 rapid jumping jacks or give everyone on the call/table a creative high-five compliment!"
        ];

        const displayBox = document.getElementById('displayBox');
        const promptIcon = document.getElementById('promptIcon');
        const promptText = document.getElementById('promptText');
        const typeBadge = document.getElementById('typeBadge');
        const finishBtn = document.getElementById('finishBtn');
        const glowLight = document.getElementById('glowLight');

        let finished = false;

        function getTruth() {
            if (finished) return;
            const item = truths[Math.floor(Math.random() * truths.length)];

            displayBox.classList.remove('is-dare');
            displayBox.classList.add('is-truth');

            triggerPop();

            promptIcon.innerText = "🤔💬";
            promptText.innerText = item;

            typeBadge.innerText = "TRUTH PROMPT";
            typeBadge.style.color = "#60a5fa";
            typeBadge.style.borderColor = "rgba(96, 165, 250, 0.4)";
            typeBadge.style.background = "rgba(58, 134, 255, 0.15)";

            glowLight.style.background = "radial-gradient(circle, rgba(58, 134, 255, 0.3) 0%, rgba(0, 0, 0, 0) 70%)";

            finishBtn.style.display = "inline-flex";
        }

        function getDare() {
            if (finished) return;
            const item = dares[Math.floor(Math.random() * dares.length)];

            displayBox.classList.remove('is-truth');
            displayBox.classList.add('is-dare');

            triggerPop();

            promptIcon.innerText = "🔥⚡";
            promptText.innerText = item;

            typeBadge.innerText = "DARE CHALLENGE";
            typeBadge.style.color = "#f87171";
            typeBadge.style.borderColor = "rgba(248, 113, 113, 0.4)";
            typeBadge.style.background = "rgba(230, 57, 70, 0.15)";

            glowLight.style.background = "radial-gradient(circle, rgba(230, 57, 70, 0.35) 0%, rgba(0, 0, 0, 0) 70%)";

            confetti({
                particleCount: 50,
                spread: 60,
                origin: { y: 0.7 }
            });

            finishBtn.style.display = "inline-flex";
        }

        function triggerPop() {
            displayBox.classList.remove('shake');
            void displayBox.offsetWidth; // Force CSS reflow
            displayBox.classList.add('shake');
        }

        function finishTurn() {
            if (finished) return;
            finished = true;

            // Grand celebration confetti
            confetti({
                particleCount: 110,
                spread: 85,
                origin: { y: 0.6 },
                colors: ['#ff4d6d', '#3a86ff', '#ffd166', '#ffffff']
            });

            finishBtn.style.opacity = "0.75";
            finishBtn.style.cursor = "default";
            finishBtn.innerText = "✨ Round Completed!";

            const notice = document.getElementById("redirectNotice");
            notice.style.display = "block";

            let seconds = 3;
            const counter = document.getElementById("countdownSec");

            const interval = setInterval(() => {
                seconds--;
                if (counter) counter.innerText = seconds;
                if (seconds <= 0) {
                    clearInterval(interval);
                }
            }, 1000);

            // Redirects to thank-you.html after 3 seconds
            setTimeout(() => {
                window.location.href = "thank-you.html";
            }, 3000);
        }
    </script>
</body>

</html>
