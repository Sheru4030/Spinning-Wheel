<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Truth or Dare - Tesco Roadshow Edition</title>
    <!-- Confetti Canvas Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at 50% 30%, #3b0a10 0%, #1a0407 55%, #0a0102 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Ambient spotlight glow */
        .ambient-glow {
            position: absolute;
            width: 620px;
            height: 620px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(238, 28, 46, 0.22) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(50px);
            pointer-events: none;
            z-index: 1;
        }

        .main-card {
            background: rgba(26, 7, 11, 0.92);
            border: 2px solid #ee1c2e;
            border-radius: 28px;
            padding: 34px 32px;
            max-width: 620px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 35px rgba(238, 28, 46, 0.35);
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: center;
            backdrop-filter: blur(12px);
            position: relative;
            z-index: 10;
        }

        /* Header Row */
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-badge {
            font-size: 0.85rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffd166;
            background: rgba(255, 209, 102, 0.12);
            border: 1px solid rgba(255, 209, 102, 0.35);
            padding: 6px 16px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .count-badge {
            background: #50080f;
            border: 1.5px solid #ff4d5a;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 800;
            color: #ffccd0;
        }

        /* Title */
        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            background: linear-gradient(180deg, #ffffff 0%, #ffccd0 40%, #ee1c2e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 3px 12px rgba(238, 28, 46, 0.4));
        }

        p.subtitle {
            color: #ffccd0;
            font-size: 0.95rem;
            margin-top: -6px;
        }

        /* Choice Select Buttons (Truth vs Dare) */
        .mode-select-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .mode-btn {
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 1.25rem;
            font-weight: 900;
            letter-spacing: 1px;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #fff;
        }

        .btn-truth {
            background: linear-gradient(135deg, #0288d1 0%, #01579b 100%);
            box-shadow: 0 6px 20px rgba(2, 136, 209, 0.4);
            border: 2px solid #4fc3f7;
        }

        .btn-truth:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(2, 136, 209, 0.6);
        }

        .btn-dare {
            background: linear-gradient(135deg, #ee1c2e 0%, #b30010 100%);
            box-shadow: 0 6px 20px rgba(238, 28, 46, 0.45);
            border: 2px solid #ff7b88;
        }

        .btn-dare:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 25px rgba(238, 28, 46, 0.65);
        }

        .mode-btn:active {
            transform: scale(0.96);
        }

        /* Challenge Card Area */
        .challenge-box {
            background: rgba(45, 9, 14, 0.8);
            border: 2px dashed #ff4d5a;
            border-radius: 20px;
            padding: 26px 22px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: all 0.3s ease;
        }

        .challenge-tag {
            font-size: 0.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 3px 12px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .tag-truth {
            background: rgba(2, 136, 209, 0.2);
            color: #4fc3f7;
            border: 1px solid #4fc3f7;
        }

        .tag-dare {
            background: rgba(238, 28, 46, 0.25);
            color: #ff8591;
            border: 1px solid #ff8591;
        }

        .prompt-text {
            font-size: 1.28rem;
            font-weight: 800;
            line-height: 1.45;
            color: #ffffff;
            animation: textPop 0.3s ease;
        }

        @keyframes textPop {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .empty-placeholder {
            color: #ffccd0;
            font-style: italic;
            font-size: 1.05rem;
        }

        /* Bottom Action Buttons */
        .btn-action-row {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .action-btn {
            padding: 13px 26px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-next {
            background: #ffd166;
            color: #1e0507;
            box-shadow: 0 4px 14px rgba(255, 209, 102, 0.35);
        }

        .btn-next:hover {
            transform: translateY(-2px);
            background: #ffe082;
        }

        .btn-finish {
            background: linear-gradient(135deg, #10b981 0%, #047857 100%);
            color: #fff;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
        }

        .btn-finish:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #34d399 0%, #059669 100%);
        }

        .redirect-notice {
            display: none;
            font-size: 1rem;
            color: #ffd166;
            font-weight: 700;
        }

        .back-link {
            font-size: 0.85rem;
            color: #ff8591;
            text-decoration: none;
            font-weight: 700;
            margin-top: -4px;
        }

        .back-link:hover {
            color: #ffffff;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="ambient-glow"></div>

    <div class="main-card">
        <!-- Top Status -->
        <div class="top-row">
            <span class="brand-badge">🎭 RPI TEAM ICEBREAKER</span>
            <span class="count-badge" id="counterBadge">Pick an option below</span>
        </div>

        <div>
            <h1>Truth or Dare 🎭</h1>
            <p class="subtitle">Choose your challenge and answer candidly in front of the team!</p>
        </div>

        <!-- Choice Selector Buttons -->
        <div class="mode-select-row">
            <button class="mode-btn btn-truth" onclick="pickChallenge('truth')">
                <span>💬</span> TRUTH
            </button>
            <button class="mode-btn btn-dare" onclick="pickChallenge('dare')">
                <span>⚡</span> DARE
            </button>
        </div>

        <!-- Dynamic Challenge Display -->
        <div class="challenge-box" id="challengeBox">
            <div class="empty-placeholder" id="placeholderMsg">
                👉 Click <strong>TRUTH</strong> or <strong>DARE</strong> to reveal your question!
            </div>
            <div id="contentWrapper" style="display: none;">
                <div class="challenge-tag" id="challengeTag"></div>
                <div class="prompt-text" id="promptText"></div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="btn-action-row">
            <button class="action-btn btn-next" id="nextBtn" onclick="nextRandomChallenge()" style="display: none;">
                🎲 Random Next
            </button>
            <button class="action-btn btn-finish" id="finishBtn" onclick="finishSession()">
                🎬 Complete &amp; Go to Video
            </button>
        </div>

        <div class="redirect-notice" id="redirectNotice">
            Directing to wrap-up video in <span id="countdownSec" style="font-weight: 900; color: #fff;">3</span>s...
        </div>

        <a href="index.html" class="back-link">← Return to Activity Spin Wheel</a>
    </div>

    <script>
        // Exact Truth Questions
        const TRUTHS = [
            "The best moment at Tesco?",
            "Describe Tesco in 2 words.",
            "What is the best thing you have come across in TBS?",
            "Have you ever joined a meeting late because you forgot about it?",
            "Have you ever pretended your internet was slow to buy yourself some time?"
        ];

        // Movement & Team-Engagement Dares
        const DARES = [
            "Stand on one leg for 15 seconds without losing your focus!",
            "Step back and complete 5 energetic jumping jacks on the spot!",
            "Walk over and give a firm, enthusiastic handshake to your best friend in the team!",
            "Give high-fives to the person on your left and the person on your right with maximum enthusiasm!"
        ];

        let truthsDeck = [...TRUTHS];
        let daresDeck = [...DARES];
        let currentType = null;
        let completed = false;

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Web Audio synthesized sound
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playChime(isTruth) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = isTruth ? "sine" : "triangle";
            osc.frequency.setValueAtTime(isTruth ? 587.33 : 370, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(isTruth ? 880 : 740, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.35);
        }

        function pickChallenge(type) {
            currentType = type;
            playChime(type === 'truth');

            document.getElementById("placeholderMsg").style.display = "none";
            document.getElementById("contentWrapper").style.display = "block";
            document.getElementById("nextBtn").style.display = "inline-flex";

            const tag = document.getElementById("challengeTag");
            const text = document.getElementById("promptText");
            const box = document.getElementById("challengeBox");

            if (type === 'truth') {
                if (truthsDeck.length === 0) truthsDeck = shuffle([...TRUTHS]);
                const q = truthsDeck.pop();

                tag.className = "challenge-tag tag-truth";
                tag.innerText = "💬 TRUTH QUESTION";
                text.innerText = `"${q}"`;
                box.style.borderColor = "#0288d1";
                document.getElementById("counterBadge").innerText = "Truth Revealed!";
            } else {
                if (daresDeck.length === 0) daresDeck = shuffle([...DARES]);
                const d = daresDeck.pop();

                tag.className = "challenge-tag tag-dare";
                tag.innerText = "⚡ DARE CHALLENGE";
                text.innerText = `"${d}"`;
                box.style.borderColor = "#ee1c2e";
                document.getElementById("counterBadge").innerText = "Dare Accepted!";
            }
        }

        function nextRandomChallenge() {
            const types = ['truth', 'dare'];
            const randomPick = types[Math.floor(Math.random() * types.length)];
            pickChallenge(randomPick);
        }

        function finishSession() {
            if (completed) return;
            completed = true;

            confetti({
                particleCount: 130,
                spread: 85,
                origin: { y: 0.6 },
                colors: ['#ee1c2e', '#0288d1', '#ffd166', '#ffffff']
            });

            const finishBtn = document.getElementById("finishBtn");
            finishBtn.style.opacity = "0.7";
            finishBtn.style.cursor = "default";
            finishBtn.innerText = "✨ Session Completed!";

            document.getElementById("redirectNotice").style.display = "block";

            let seconds = 3;
            const counter = document.getElementById("countdownSec");
            const interval = setInterval(() => {
                seconds--;
                if (counter) counter.innerText = seconds;
                if (seconds <= 0) clearInterval(interval);
            }, 1000);

            setTimeout(() => {
                window.location.href = "thank-you.html";
            }, 3000);
        }
    </script>
</body>

</html>
